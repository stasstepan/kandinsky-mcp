[project]
name = "kandinsky-mcp"
version = "0.1.0"
description = "MCP-сервер для генерации изображений через Kandinsky API"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "mcp>=2.3.0,<3",
    "httpx>=0.28.1,<1",
    "pillow>=11.0.0",
    "pydantic>=2.12",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.7",
]

[project.scripts]
kandinsky-mcp = "kandinsky_mcp.__main__:main"
kandinsky-mcp-smoke = "kandinsky_mcp.smoke:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kandinsky_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "B",         # bugbear
    "UP",        # pyupgrade
    "SIM",       # simplify
    "ASYNC",     # async-специфичные ошибки
    "RUF",       # ruff-специфика
]
ignore = [
    "E501",      # длина строки — за форматированием следит line-length
    "B008",      # аргументы по умолчанию — ок для Starlette/pydantic-паттернов
    "ASYNC109",  # таймаут как параметр — осознанно: прокидываем в httpx
    "RUF001",    # кириллица в строках: интерфейс и ошибки на русском
    "RUF002",    # кириллица в докстрингах
    "RUF003",    # кириллица в комментариях
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM117"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:kandinsky_mcp.*"]
addopts = "-ra -p no:cacheprovider"
