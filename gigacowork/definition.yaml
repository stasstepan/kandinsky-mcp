# Definition интеграции Kandinsky MCP для GigaCowork (cowork-proxy-definition/v2).
# Адрес MCP сюда не записывается: он фиксируется при регистрации.
# Секретов в файле нет: ключ администратор вводит в подключении.

definition_version: cowork-proxy-definition/v2
id: kandinsky-image
revision: "1"

# Несекретных настроек нет: пользователю нечего заполнять, кроме ключа.
configuration:
  fields: []

authorization:
  default: custom_headers
  allow_shared_account: true
  methods:
    custom_headers:
      fields:
        - key: api_key
          label: API-ключ Kandinsky MCP
          type: string
          required: true
          secret: true
          editable: true
      delivery:
        - source: api_key
          target:
            kind: header
            name: X-API-Key

runtime:
  # GigaCowork: не больше 60 с на tools/call; инструменты ждут внутри до 45 с.
  request_timeout_ms: 55000
  max_response_bytes: 10485760
  forward_client_headers: []
